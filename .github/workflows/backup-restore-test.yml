# Monthly restore drill (#48, #108): restores the latest backup with the production procedure (npm run db:restore)
# into a throwaway local Supabase stack (Postgres + GoTrue) and checks rows, grants and RLS.
# Required (environment "backup"): secrets BACKUP_AGE_IDENTITY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY (read-only token is enough); optional HEALTHCHECK_URL_RESTORE_TEST.
# Variable BACKUP_REMOTE (e.g. r2:monetio-backups) at repository level.
# The sysadmin console (#105) dispatches it with a chosen backup and a ref that names the run; it reads
# the RESTORE_REPORT line from the job log. The restore target is always the throwaway local stack.
name: backup-restore-test
run-name: ${{ github.event_name == 'workflow_dispatch' && format('restore-drill {0}', inputs.ref) || 'backup-restore-test' }}

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      backup:
        description: "Backup: latest, AAAA-MM-GG o chiave (es. manual/monetio-....dump.zst.age)"
        required: false
        default: latest
      ref:
        description: "Riferimento della richiesta dalla console"
        required: false
        default: manual

jobs:
  restore:
    if: vars.BACKUP_REMOTE != ''
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 20
    env:
      BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      # Local stack defaults from docker-compose.dev.yml (throwaway, never exposed).
      POSTGRES_URL_NON_POOLING: postgres://postgres:monetio-local-password@localhost:54322/postgres?sslmode=disable
      HC_URL: ${{ secrets.HEALTHCHECK_URL_RESTORE_TEST }}
      # Inputs reach the shell as env values only, never interpolated into the script.
      RESTORE_BACKUP: ${{ inputs.backup || 'latest' }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18 age zstd
          sudo bash packages/worker/deploy/install-rclone.sh
          # /usr/bin/pg_restore is Debian's pg_wrapper, which follows the runner's local Postgres 16 cluster.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Start Postgres and GoTrue
        run: docker compose -f docker-compose.dev.yml up -d --wait db auth
      - name: Restore and verify
        run: |
          case "$RESTORE_BACKUP" in
            latest|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]|daily/*|weekly/*|monthly/*|manual/*) ;;
            *) echo "Backup non valido: $RESTORE_BACKUP"; exit 1 ;;
          esac
          if [ "$SCHEDULED" = "true" ]; then
            [ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL/start" || true
            npm run db:restore -- --backup latest --max-age-hours 48 --yes --report
          else
            npm run db:restore -- --backup "$RESTORE_BACKUP" --yes --report
          fi
      # Healthchecks.io tracks the monthly drill only: console drills must not move its schedule.
      - name: Report success
        if: success() && github.event_name == 'schedule'
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL" || true'
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL/fail" || true'
