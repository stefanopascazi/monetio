# Monthly restore drill (#48): restores the latest backup into a throwaway Postgres 17 and checks it.
# Required (environment "backup"): secrets BACKUP_AGE_IDENTITY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY (read-only token is enough); optional HEALTHCHECK_URL_RESTORE_TEST.
# Variable BACKUP_REMOTE (e.g. r2:monetio-backups) at repository level.
name: backup-restore-test

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

jobs:
  restore:
    if: vars.BACKUP_REMOTE != ''
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      HC_URL: ${{ secrets.HEALTHCHECK_URL_RESTORE_TEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17 age zstd
          sudo bash packages/worker/deploy/install-rclone.sh
      - name: Restore and verify
        run: |
          [ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL/start" || true
          bash packages/worker/scripts/restore-test.sh
      - name: Report success
        if: success()
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL" || true'
      - name: Report failure
        if: failure()
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 "$HC_URL/fail" || true'
