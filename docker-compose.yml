# MonetIO full local stack: Supabase services (docker-compose.dev.yml) + dockerized app and cron.
# Start: docker compose up -d --build   ->  app http://localhost:3000, email http://localhost:8025
# Defaults are LOCAL-ONLY demo secrets; override them in .env (see .env.docker.example).

name: monetio

include:
  - docker-compose.dev.yml

services:
  app:
    build: { context: ., target: app }
    image: monetio:latest
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      CRON_SECRET: ${CRON_SECRET:-monetio-local-cron}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Replaces the Vercel Cron: books recurring items at startup and then once a day.
  cron:
    image: curlimages/curl:8.15.0
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:-monetio-local-cron}
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 20
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/sync || true
          echo
          sleep 86400
        done

