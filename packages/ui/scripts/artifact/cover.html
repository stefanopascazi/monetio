<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MonetIO — cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--mio-bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--mio-bg); }
  .cover svg { position: absolute; inset: 0; }
  .mint { fill: var(--mio-brand); }
  .coral { fill: var(--mio-accent); }
  .peri { fill: var(--mio-forecast); }
  .mint-soft { fill: var(--mio-brand-soft); }
  .ink { fill: var(--mio-ink); }
  .ground { fill: var(--mio-bg); }
  .card { rx: var(--mio-radius-xl); }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font: 700 104px/0.92 var(--mio-font-display); letter-spacing: -0.05em; color: var(--mio-ink); }
  .name span { color: var(--mio-brand-ink); }
  .tag { margin: 14px 0 0; font: 400 14px/20px var(--mio-font-sans); color: var(--mio-ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: mio-brand pill 208x288 (bleeds top), mio-accent card 176x136, mio-forecast card 176x136, mio-brand-soft card 176x136, mio-ink pill 96x48
      arrangement: one tall mint pill with a 2x2 grid of rounded satellites stepping to the right edge, coins cut from the ground
      pattern: coins (discs from mio-radius-pill) cut out of the mint pill and stacked on the coral card,
               chosen because the system's shape language is pills and discs: "Fresh, not formal" with large radii
      scales: gaps mio-space-4 (16), card corners mio-radius-xl (28), coin radius 14/20 (half of mio-radius-xl and of 40px tiles)
    -->
    <rect class="mint" x="488" y="-104" width="208" height="392" rx="104" />
    <circle class="ground" cx="592" cy="64" r="28" />
    <circle class="ground" cx="592" cy="132" r="20" />
    <circle class="ground" cx="592" cy="184" r="14" />

    <rect class="coral card" x="712" y="-28" width="176" height="164" />
    <rect class="peri card" x="904" y="-28" width="120" height="164" />
    <rect class="mint-soft card" x="712" y="152" width="176" height="164" />
    <rect class="ink" x="904" y="152" width="120" height="164" rx="28" />

    <circle class="ground" cx="752" cy="96" r="20" />
    <circle class="ground" cx="796" cy="96" r="20" />
    <circle class="ground" cx="840" cy="96" r="20" />
    <circle class="mint" cx="760" cy="200" r="14" />
    <circle class="mint" cx="800" cy="200" r="14" />
  </svg>
  <div class="text">
    <p class="name">monet<span>io</span></p>
    <p class="tag">Household money, together. Accounts, due dates, budgets and where it's all heading.</p>
  </div>
</div>
</body>
</html>
